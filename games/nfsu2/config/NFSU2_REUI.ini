; NFSU2 REUI settings

[General]
PanelKey = F6               ; the editor panel
MenuKey = F7                ; opens the start menu page (only without NFSU2-UniPad; UniPad has its own menu key)
LogFile = 1                 ; write NFSU2_REUI.log

[Hud]
ReplaceGameHud = 1          ; hide the game's HUD where the layout draws its own (coming with the HUD data)
